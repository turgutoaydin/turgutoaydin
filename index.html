<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Satranç - Dikey Mobil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1e1e2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #2c2c3e;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        h1 {
            color: #f0e6d0;
            text-align: center;
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        #status {
            color: #b8b0a0;
            text-align: center;
            font-size: 16px;
            margin-bottom: 12px;
            background: #3a3a4e;
            padding: 8px;
            border-radius: 30px;
        }
        .board-wrapper {
            display: flex;
            justify-content: center;
        }
        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #d2b48c;
            border-radius: 16px;
            box-shadow: inset 0 0 0 2px #4a3f33;
            touch-action: none;
            cursor: pointer;
            max-width: 400px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #4a4a62;
            border: none;
            color: white;
            font-size: 18px;
            padding: 12px 0;
            border-radius: 40px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 0 #2a2a3a;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #2a2a3a;
        }
        #turn-indicator {
            text-align: center;
            margin-top: 10px;
            font-size: 15px;
            color: #c0b8a8;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>♚ Satranç</h1>
    <div id="status">Beyaz'ın hamlesi</div>
    <div class="board-wrapper">
        <canvas id="chessCanvas" width="400" height="400"></canvas>
    </div>
    <div class="controls">
        <button id="resetBtn">⟳ Yeni Oyun</button>
        <button id="undoBtn">↩ Geri Al</button>
    </div>
    <div id="turn-indicator">⚪ Beyaz oynuyor</div>
</div>

<script>
    (function() {
        // ---- SATRANÇ MOTORU (BASİT) ----
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const turnDiv = document.getElementById('turn-indicator');

        let board = [];
        let turn = 'w'; // 'w' veya 'b'
        let selected = null; // {row, col}
        let moveHistory = [];
        let gameOver = false;

        // Başlangıç dizilimi
        function initBoard() {
            const backRank = ['r','n','b','q','k','b','n','r'];
            board = [];
            board.push(backRank.map(p => 'b'+p));
            board.push(Array(8).fill('bp'));
            for(let r=2; r<6; r++) board.push(Array(8).fill(''));
            board.push(Array(8).fill('wp'));
            board.push(backRank.map(p => 'w'+p));
        }

        // Kopya
        function copyBoard(b) { return b.map(row => [...row]); }

        // Hamle geçmişine ekle
        function pushHistory(from, to, captured) {
            moveHistory.push({ from, to, captured, boardState: copyBoard(board) });
        }

        // Geri al
        function undoMove() {
            if(gameOver) {
                gameOver = false;
                turn = 'w';
                selected = null;
                moveHistory = [];
                initBoard();
                updateUI();
                return;
            }
            if(moveHistory.length === 0) return;
            const last = moveHistory.pop();
            board = last.boardState;
            turn = (turn === 'w' ? 'b' : 'w');
            selected = null;
            gameOver = false;
            updateUI();
        }

        // ---- HAREKET KURALLARI (basit, şah kontrolü yok) ----
        function getLegalMoves(row, col) {
            const piece = board[row][col];
            if(!piece) return [];
            const color = piece[0];
            const type = piece[1];
            const moves = [];
            const enemy = (color === 'w' ? 'b' : 'w');

            const addMove = (r, c) => {
                if(r<0||r>7||c<0||c>7) return false;
                const target = board[r][c];
                if(target && target[0] === color) return false;
                moves.push({row:r, col:c});
                return !target; // boşsa devam et
            };

            switch(type) {
                case 'p': {
                    const dir = (color === 'w' ? -1 : 1);
                    const startRow = (color === 'w' ? 6 : 1);
                    // ileri
                    if(board[row+dir] && board[row+dir][col] === '') {
                        moves.push({row: row+dir, col});
                        if(row === startRow && board[row+2*dir] && board[row+2*dir][col] === '') {
                            moves.push({row: row+2*dir, col});
                        }
                    }
                    // çapraz yeme
                    for(let dc of [-1,1]) {
                        const nc = col+dc;
                        if(nc<0||nc>7) continue;
                        const nr = row+dir;
                        if(nr<0||nr>7) continue;
                        const target = board[nr][nc];
                        if(target && target[0] === enemy) moves.push({row:nr, col:nc});
                    }
                    break;
                }
                case 'n': {
                    const offsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                    for(let [dr,dc] of offsets) {
                        const nr = row+dr, nc = col+dc;
                        if(nr<0||nr>7||nc<0||nc>7) continue;
                        const target = board[nr][nc];
                        if(!target || target[0] !== color) moves.push({row:nr, col:nc});
                    }
                    break;
                }
                case 'b': {
                    for(let dr of [-1,1]) for(let dc of [-1,1]) {
                        for(let i=1; i<8; i++) {
                            if(!addMove(row+dr*i, col+dc*i)) break;
                        }
                    }
                    break;
                }
                case 'r': {
                    for(let dr of [-1,1]) {
                        for(let i=1; i<8; i++) {
                            if(!addMove(row+dr*i, col)) break;
                        }
                    }
                    for(let dc of [-1,1]) {
                        for(let i=1; i<8; i++) {
                            if(!addMove(row, col+dc*i)) break;
                        }
                    }
                    break;
                }
                case 'q': {
                    for(let dr of [-1,0,1]) for(let dc of [-1,0,1]) {
                        if(dr===0 && dc===0) continue;
                        for(let i=1; i<8; i++) {
                            if(!addMove(row+dr*i, col+dc*i)) break;
                        }
                    }
                    break;
                }
                case 'k': {
                    for(let dr of [-1,0,1]) for(let dc of [-1,0,1]) {
                        if(dr===0 && dc===0) continue;
                        addMove(row+dr, col+dc);
                    }
                    break;
                }
            }
            return moves;
        }

        // ---- OYUN MANTIĞI ----
        function makeMove(from, to) {
            const piece = board[from.row][from.col];
            const captured = board[to.row][to.col];
            pushHistory(from, to, captured);
            board[to.row][to.col] = piece;
            board[from.row][from.col] = '';
            // Piyon terfisi (basit: otomatik Vezir)
            if(piece[1] === 'p' && (to.row === 0 || to.row === 7)) {
                board[to.row][to.col] = piece[0] + 'q';
            }
            turn = (turn === 'w' ? 'b' : 'w');
            selected = null;
            checkGameOver();
            updateUI();
        }

        function checkGameOver() {
            // çok basit: hiç hamle yoksa oyun bitti
            let hasMove = false;
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const p = board[r][c];
                    if(p && p[0] === turn) {
                        if(getLegalMoves(r,c).length > 0) hasMove = true;
                    }
                }
            }
            if(!hasMove) gameOver = true;
        }

        // ---- TIKLAMA / DOKUNMATİK ----
        function handleClick(e) {
            if(gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const size = rect.width;
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            const col = Math.floor(x / size * 8);
            const row = Math.floor(y / size * 8);
            if(row<0||row>7||col<0||col>7) return;

            const piece = board[row][col];
            // Eğer seçili yoksa ve kendi taşıysa seç
            if(!selected) {
                if(piece && piece[0] === turn) {
                    const moves = getLegalMoves(row, col);
                    if(moves.length > 0) {
                        selected = {row, col, moves};
                        updateUI();
                    }
                }
                return;
            }

            // Seçili varken
            // Aynı kareye tekrar tıkla -> seçimi kaldır
            if(selected.row === row && selected.col === col) {
                selected = null;
                updateUI();
                return;
            }

            // Hamle mi?
            const isLegal = selected.moves.some(m => m.row === row && m.col === col);
            if(isLegal) {
                makeMove({row:selected.row, col:selected.col}, {row, col});
            } else {
                // başka bir kendi taşına tıklandıysa değiştir
                if(piece && piece[0] === turn) {
                    const moves = getLegalMoves(row, col);
                    if(moves.length > 0) {
                        selected = {row, col, moves};
                        updateUI();
                    } else {
                        selected = null;
                        updateUI();
                    }
                } else {
                    selected = null;
                    updateUI();
                }
            }
        }

        // ---- ÇİZİM ----
        function drawBoard() {
            const size = 400;
            ctx.clearRect(0,0,size,size);
            const colors = ['#f0d9b5','#b58863'];
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    ctx.fillStyle = colors[(r+c)%2];
                    ctx.fillRect(c*50, r*50, 50, 50);
                }
            }

            // Seçili kare
            if(selected) {
                ctx.fillStyle = 'rgba(255,255,100,0.4)';
                ctx.fillRect(selected.col*50, selected.row*50, 50, 50);
                // yasal hamleleri göster
                for(let m of selected.moves) {
                    ctx.beginPath();
                    ctx.arc(m.col*50+25, m.row*50+25, 12, 0, 2*Math.PI);
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fill();
                }
            }

            // Taşlar
            const unicode = {
                'w': { 'k':'♔','q':'♕','r':'♖','b':'♗','n':'♘','p':'♙' },
                'b': { 'k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟' }
            };
            ctx.font = '42px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const p = board[r][c];
                    if(!p) continue;
                    const color = p[0];
                    const type = p[1];
                    const sym = unicode[color]?.[type];
                    if(sym) {
                        ctx.fillStyle = (color === 'w') ? '#fff' : '#1a1a1a';
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 6;
                        ctx.fillText(sym, c*50+25, r*50+25);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // Oyun bitti mesajı
            if(gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 150, 400, 100);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('🏁 OYUN BİTTİ', 200, 205);
            }
        }

        function updateUI() {
            drawBoard();
            const turnText = (turn === 'w') ? 'Beyaz' : 'Siyah';
            statusDiv.textContent = gameOver ? 'Oyun bitti' : `${turnText}'ın hamlesi`;
            turnDiv.innerHTML = (turn === 'w') ? '⚪ Beyaz oynuyor' : '⚫ Siyah oynuyor';
        }

        // ---- RESET ----
        function resetGame() {
            initBoard();
            turn = 'w';
            selected = null;
            moveHistory = [];
            gameOver = false;
            updateUI();
        }

        // ---- OLAY BAĞLAMALARI ----
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleClick(e);
        }, {passive:false});

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('undoBtn').addEventListener('click', undoMove);

        // BAŞLAT
        initBoard();
        updateUI();
    })();
</script>
</body>
</html>
