<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>101 Okey Plus</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{
    background:#0b4d28;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* Üst bar */
  .topbar{
    background:linear-gradient(#1a3a2a,#0f2a1c);
    padding:8px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    border-bottom:2px solid #2e7d32;
  }
  .score-box{
    background:#1b5e20;
    padding:4px 12px;
    border-radius:20px;
    font-weight:700;
    font-size:14px;
  }
  .btn-new{
    background:#c62828;
    border:none;
    color:#fff;
    width:32px;height:32px;
    border-radius:50%;
    font-size:16px;
  }

  /* Oyuncular */
  .players{
    display:flex;
    justify-content:space-around;
    padding:6px 4px;
    background:rgba(0,0,0,.25);
    font-size:11px;
  }
  .player{text-align:center;opacity:.65}
  .player.active{opacity:1;color:#ffd54f;font-weight:700}
  .player .cnt{
    background:rgba(255,255,255,.12);
    border-radius:10px;
    padding:1px 7px;
    margin-top:2px;
    display:inline-block;
  }

  /* Masa alanı */
  .table-area{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:6px;
    gap:6px;
    overflow:hidden;
  }

  /* Atılan taş + çek */
  .center-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    padding:4px 0;
  }
  .discard{
    width:38px;height:52px;
    background:rgba(0,0,0,.35);
    border:2px dashed rgba(255,255,255,.25);
    border-radius:5px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .draw-btn{
    background:linear-gradient(#ffca28,#f9a825);
    color:#222;
    border:none;
    padding:8px 18px;
    border-radius:22px;
    font-weight:800;
    font-size:13px;
    box-shadow:0 3px 0 #c79100;
  }
  .draw-btn:disabled{opacity:.45;box-shadow:none}

  /* Oyuncunun masa setleri */
  .board{
    flex:1;
    background:rgba(0,0,0,.18);
    border:2px solid #2e7d32;
    border-radius:10px;
    padding:6px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .board-title{
    font-size:11px;
    opacity:.7;
    text-align:center;
  }
  .set-row{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    background:rgba(0,0,0,.2);
    border-radius:6px;
    padding:4px;
    min-height:42px;
    align-items:center;
  }
  .set-row.empty{
    justify-content:center;
    color:rgba(255,255,255,.3);
    font-size:11px;
  }

  /* El alanı */
  .hand-area{
    background:linear-gradient(#1b3a28,#0f2a1c);
    border-top:3px solid #2e7d32;
    padding:6px 6px 12px;
  }
  .hand-tools{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
    font-size:12px;
  }
  .tools{
    display:flex;
    gap:4px;
  }
  .tools button{
    background:rgba(255,255,255,.12);
    border:none;
    color:#fff;
    padding:4px 9px;
    border-radius:14px;
    font-size:11px;
  }
  .tools button.primary{background:#2e7d32}
  .hand{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    justify-content:center;
    max-height:110px;
    overflow-y:auto;
    padding:2px;
  }

  /* Taş */
  .tile{
    width:32px;
    height:44px;
    border-radius:4px;
    background:#f5f0e0;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:14px;
    position:relative;
    transition:transform .12s;
  }
  .tile.selected{
    transform:translateY(-10px);
    outline:2.5px solid #ffd54f;
    z-index:5;
  }
  .tile .n{line-height:1}
  .tile .d{
    width:6px;height:6px;
    border-radius:50%;
    margin-top:2px;
  }
  .tile.black{color:#111}.tile.black .d{background:#111}
  .tile.red{color:#c62828}.tile.red .d{background:#c62828}
  .tile.blue{color:#1565c0}.tile.blue .d{background:#1565c0}
  .tile.yellow{color:#f9a825}.tile.yellow .d{background:#f9a825}
  .tile.okey{
    background:linear-gradient(#fff8e1,#ffecb3);
    color:#e65100;
  }
  .tile.okey .d{background:#e65100}

  /* Mesaj */
  .msg{
    position:fixed;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.88);
    padding:10px 18px;
    border-radius:12px;
    font-size:14px;
    z-index:99;
    display:none;
    max-width:85%;
    text-align:center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>101 Okey Plus</div>
  <div class="score-box">Puan: <span id="score">0</span></div>
  <button class="btn-new" onclick="init()">↺</button>
</div>

<div class="players">
  <div class="player active" id="p0"><div>Sen</div><div class="cnt"><span id="c0">14</span></div></div>
  <div class="player" id="p1"><div>Bot1</div><div class="cnt"><span id="c1">14</span></div></div>
  <div class="player" id="p2"><div>Bot2</div><div class="cnt"><span id="c2">14</span></div></div>
  <div class="player" id="p3"><div>Bot3</div><div class="cnt"><span id="c3">14</span></div></div>
</div>

<div class="table-area">
  <div class="center-row">
    <div class="discard" id="discard"></div>
    <button class="draw-btn" id="drawBtn" onclick="draw()">Taş Çek</button>
  </div>

  <div class="board" id="board">
    <div class="board-title">Masandaki Setler (Seri / Çift)</div>
    <div class="set-row empty" id="emptyHint">Henüz set yok • Taş seçip “Masaya” bas</div>
  </div>
</div>

<div class="hand-area">
  <div class="hand-tools">
    <span>Elin (<span id="hcnt">14</span>)</span>
    <div class="tools">
      <button onclick="autoSeri()">Seri Diz</button>
      <button onclick="autoCift()">Çift Diz</button>
      <button onclick="sortHand()">Sırala</button>
      <button class="primary" onclick="toBoard()">Masaya</button>
      <button onclick="discardSel()">At</button>
    </div>
  </div>
  <div class="hand" id="hand"></div>
</div>

<div class="msg" id="msg"></div>

<script>
const COLORS = ['black','red','blue','yellow'];
const CN = {black:'Siyah',red:'Kırmızı',blue:'Mavi',yellow:'Sarı'};

let deck=[], hand=[], boardSets=[], discard=[], selected=new Set(), score=0, turn=0, over=false;

function makeDeck(){
  deck=[];
  for(const c of COLORS){
    for(let n=1;n<=13;n++){
      deck.push({n,c,id:c+n+'a'});
      deck.push({n,c,id:c+n+'b'});
    }
  }
  deck.push({n:0,c:'okey',id:'ok1'});
  deck.push({n:0,c:'okey',id:'ok2'});
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
}

function init(){
  makeDeck();
  hand=[]; boardSets=[]; discard=[]; selected.clear();
  score=0; turn=0; over=false;
  for(let i=0;i<14;i++) hand.push(deck.pop());
  if(deck.length) discard.push(deck.pop());
  document.getElementById('score').textContent=score;
  render();
  show('Oyun başladı • Seri/Çift dizebilirsin');
}

function tileEl(t, idx, sel=false){
  const d=document.createElement('div');
  d.className=`tile ${t.c}`+(sel?' selected':'');
  d.innerHTML=`<div class="n">${t.n===0?'★':t.n}</div><div class="d"></div>`;
  if(idx!==undefined) d.onclick=()=>toggle(idx);
  return d;
}

function render(){
  // El
  const h=document.getElementById('hand');
  h.innerHTML='';
  hand.forEach((t,i)=>h.appendChild(tileEl(t,i,selected.has(i))));
  document.getElementById('hcnt').textContent=hand.length;
  document.getElementById('c0').textContent=hand.length;

  // Atılan
  const disc=document.getElementById('discard');
  disc.innerHTML='';
  if(discard.length){
    const t=discard[discard.length-1];
    disc.appendChild(tileEl(t));
  }

  // Board setleri
  const b=document.getElementById('board');
  b.innerHTML='<div class="board-title">Masandaki Setler (Seri / Çift)</div>';
  if(boardSets.length===0){
    const e=document.createElement('div');
    e.className='set-row empty';
    e.textContent='Henüz set yok • Taş seçip “Masaya” bas';
    b.appendChild(e);
  }else{
    boardSets.forEach((set,si)=>{
      const row=document.createElement('div');
      row.className='set-row';
      set.forEach(t=>row.appendChild(tileEl(t)));
      // set sil
      const del=document.createElement('button');
      del.textContent='×';
      del.style.cssText='background:#c62828;border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;margin-left:4px';
      del.onclick=()=>{
        hand.push(...boardSets[si]);
        boardSets.splice(si,1);
        selected.clear();
        calcScore();
        render();
      };
      row.appendChild(del);
      b.appendChild(row);
    });
  }

  document.getElementById('drawBtn').disabled = turn!==0 || over;
}

function toggle(i){
  if(turn!==0||over) return;
  selected.has(i)?selected.delete(i):selected.add(i);
  render();
}

function show(t){
  const m=document.getElementById('msg');
  m.textContent=t;
  m.style.display='block';
  setTimeout(()=>m.style.display='none',2000);
}

function draw(){
  if(turn!==0||over||!deck.length) return;
  hand.push(deck.pop());
  selected.clear();
  render();
  show('Taş çektin • Şimdi at veya masaya koy');
}

function discardSel(){
  if(turn!==0||over) return;
  if(selected.size!==1){show('Sadece 1 taş seçip at');return;}
  const i=[...selected][0];
  discard.push(hand.splice(i,1)[0]);
  selected.clear();
  calcScore();
  render();
  show('Taş atıldı');
  // basit bot geçişi
  setTimeout(()=>{
    turn=1;
    render();
    setTimeout(()=>{
      // bot rastgele at
      if(deck.length) deck.pop(); // simüle
      turn=0;
      render();
      show('Sıra sende');
    },900);
  },600);
}

function sortHand(){
  hand.sort((a,b)=>{
    if(a.c==='okey') return 1;
    if(b.c==='okey') return -1;
    if(a.c!==b.c) return COLORS.indexOf(a.c)-COLORS.indexOf(b.c);
    return a.n-b.n;
  });
  selected.clear();
  render();
}

// ===== OTOMATİK SERİ =====
function autoSeri(){
  // aynı renkte peş peşe 3+ taşları öne al
  const byColor={};
  hand.forEach((t,i)=>{
    if(t.c==='okey') return;
    if(!byColor[t.c]) byColor[t.c]=[];
    byColor[t.c].push({...t,idx:i});
  });
  let newOrder=[];
  const used=new Set();
  for(const c of COLORS){
    if(!byColor[c]) continue;
    byColor[c].sort((a,b)=>a.n-b.n);
    let run=[];
    for(const t of byColor[c]){
      if(run.length===0 || t.n===run[run.length-1].n+1){
        run.push(t);
      }else{
        if(run.length>=3) run.forEach(x=>{newOrder.push(hand[x.idx]);used.add(x.idx);});
        run=[t];
      }
    }
    if(run.length>=3) run.forEach(x=>{newOrder.push(hand[x.idx]);used.add(x.idx);});
  }
  // kalanlar
  hand.forEach((t,i)=>{if(!used.has(i)) newOrder.push(t);});
  hand=newOrder;
  selected.clear();
  render();
  show('Seriler öne alındı');
}

// ===== OTOMATİK ÇİFT =====
function autoCift(){
  const byNum={};
  hand.forEach((t,i)=>{
    if(t.c==='okey') return;
    if(!byNum[t.n]) byNum[t.n]=[];
    byNum[t.n].push({...t,idx:i});
  });
  let newOrder=[];
  const used=new Set();
  for(let n=1;n<=13;n++){
    if(!byNum[n] || byNum[n].length<2) continue;
    // aynı sayıdan en az 2 tane (çift veya 3-4)
    byNum[n].forEach(x=>{
      newOrder.push(hand[x.idx]);
      used.add(x.idx);
    });
  }
  hand.forEach((t,i)=>{if(!used.has(i)) newOrder.push(t);});
  hand=newOrder;
  selected.clear();
  render();
  show('Çiftler / gruplar öne alındı');
}

// ===== MASAYA KOY =====
function toBoard(){
  if(selected.size<3){show('En az 3 taş seç (seri veya aynı sayı)');return;}
  const idxs=[...selected].sort((a,b)=>a-b);
  const tiles=idxs.map(i=>hand[i]);

  // basit kontrol: hepsi aynı sayı mı? veya aynı renk peş peşe mi?
  const nums=tiles.map(t=>t.n).filter(n=>n>0);
  const cols=tiles.map(t=>t.c).filter(c=>c!=='okey');
  const allSameNum = nums.length && nums.every(n=>n===nums[0]);
  const allSameCol = cols.length && cols.every(c=>c===cols[0]);
  let isRun=false;
  if(allSameCol){
    const sorted=[...nums].sort((a,b)=>a-b);
    isRun=sorted.every((n,i)=>i===0||n===sorted[i-1]+1);
  }

  if(!allSameNum && !isRun){
    show('Geçersiz set! Aynı sayı veya peş peşe aynı renk olmalı');
    return;
  }

  // masaya ekle
  boardSets.push(tiles);
  // elden çıkar (ters sırada splice)
  for(let i=idxs.length-1;i>=0;i--) hand.splice(idxs[i],1);
  selected.clear();
  calcScore();
  render();
  show('Set masaya kondu ✓');
}

function calcScore(){
  // kalan taş sayısı * -1 + set bonus
  const remaining=hand.length;
  const setBonus=boardSets.length*15;
  score=Math.max(0, 100 - remaining*5 + setBonus);
  document.getElementById('score').textContent=score;
}

init();
</script>
</body>
</html>
