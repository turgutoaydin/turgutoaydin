<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>101 Okey · Okey Masası</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a2e1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 6px;
      margin: 0;
    }
    #game {
      max-width: 450px;
      width: 100%;
      background: #2d5e3f;
      background-image: radial-gradient(circle at 30% 30%, #3e7a52, #1f452f);
      border-radius: 60px 60px 36px 36px;
      padding: 14px 10px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,200,0.3);
      border: 2px solid #b8a06b;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 10px 4px;
      color: #f7f0d6;
      text-shadow: 0 2px 3px #1f2f1a;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .header span {
      background: #1f3a28;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      box-shadow: inset 0 -2px 0 #4f7a4a;
      border: 1px solid #b1985a;
    }
    .header .turn-indicator {
      background: #c9b37a;
      color: #1f3a1f;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    /* PC alanları - masa üstü */
    .pc-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .pc-hand {
      background: #213d2bcc;
      backdrop-filter: blur(2px);
      padding: 6px 6px;
      border-radius: 40px;
      border: 1px solid #b8a06b;
      box-shadow: inset 0 0 12px #0f1f12;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      min-height: 38px;
      gap: 3px;
    }
    .pc-hand .tile {
      background: #d9cba4;
      width: 28px;
      height: 38px;
      border-radius: 5px 5px 8px 8px;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2f1a;
      box-shadow: 0 3px 0 #7a6a42, 0 4px 8px rgba(0,0,0,0.4);
      border: 1px solid #ede3c0;
    }
    .pc-hand .tile.face-down {
      background: #37634b;
      background-image: repeating-linear-gradient(45deg, #2f523a 0px, #2f523a 4px, #4c7a5a 4px, #4c7a5a 8px);
      border-color: #5f7a4a;
      box-shadow: 0 3px 0 #1f3a1f;
      color: transparent;
    }
    .pc-hand .tile.face-down::before {
      content: "?";
      color: #d9cba4;
      font-size: 1rem;
      opacity: 0.3;
    }
    .pc-label {
      color: #efeacb;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pc-label .badge {
      background: #2f4f2f;
      padding: 0 10px;
      border-radius: 30px;
      border: 1px solid #b1985a;
    }

    /* OYUNCU ALANI - OKEY İSTAKASI */
    .player-area {
      background: #1c3a28cc;
      backdrop-filter: blur(3px);
      border-radius: 40px 40px 28px 28px;
      padding: 10px 4px 8px;
      margin: 6px 0 4px;
      border: 2px solid #b8a06b;
      box-shadow: inset 0 0 20px #0f2a18;
    }
    .player-hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      min-height: 64px;
      padding: 4px 2px;
    }
    .tile {
      background: #f2e5c7;
      background: linear-gradient(145deg, #faf0d6, #e8dbb8);
      width: 40px;
      height: 52px;
      border-radius: 6px 6px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
      color: #1f2f1a;
      box-shadow: 0 4px 0 #7a6a42, 0 6px 12px rgba(0,0,0,0.5);
      border: 1px solid #f7efd0;
      transition: all 0.08s;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
    }
    .tile.selected {
      transform: translateY(-10px);
      box-shadow: 0 8px 0 #7a6a42, 0 12px 20px black;
      border-color: #ffe484;
    }
    .tile.joker {
      background: #e0c87a;
      background: radial-gradient(circle at 30% 20%, #fae68c, #c9ae4a);
      border-color: #f5d742;
      color: #1f2a0f;
      box-shadow: 0 4px 0 #9e8230, 0 6px 12px black;
    }
    .tile.taş-çek {
      background: #aac7b0;
      background: radial-gradient(circle at 30% 20%, #d4ebd0, #7fa585);
      border-color: #b8d0a0;
      box-shadow: 0 4px 0 #4f6a4a;
    }
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 6px 2px;
      flex-wrap: wrap;
    }
    .btn {
      background: #d4c28b;
      border: none;
      border-radius: 60px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.7rem;
      color: #1f2f1a;
      box-shadow: 0 4px 0 #7a6a42, 0 4px 10px rgba(0,0,0,0.4);
      border: 1px solid #ede3b0;
      transition: 0.06s linear;
      touch-action: manipulation;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: 56px;
      text-align: center;
      background: linear-gradient(145deg, #e6d8ae, #c9b87a);
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7a6a42;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #5f4f2a;
      pointer-events: none;
    }
    .btn-primary {
      background: #d6b06a;
      background: linear-gradient(145deg, #efd48c, #c7a458);
      border-color: #f5e5a0;
      color: #1f2a0f;
      flex: 1.5;
    }
    .btn-success {
      background: #7aaa6a;
      background: linear-gradient(145deg, #8fc07a, #5f8a4a);
      border-color: #b0d090;
      color: #1f2f0a;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      color: #efeacb;
      padding: 2px 12px;
      font-size: 0.65rem;
      font-weight: 500;
      text-shadow: 0 2px 2px #0f1f0a;
    }
    .info-row .chip {
      background: #1f3a24;
      padding: 2px 14px;
      border-radius: 30px;
      border: 1px solid #b1985a;
    }
    .message-box {
      background: #1f2f1acc;
      backdrop-filter: blur(2px);
      border-radius: 60px;
      padding: 5px 14px;
      color: #f7f0d6;
      font-weight: 500;
      font-size: 0.75rem;
      text-align: center;
      border: 1px solid #b8a06b;
      margin: 4px 0 2px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer {
      color: #b8a06b;
      font-size: 0.5rem;
      text-align: center;
      padding: 8px 0 0;
      opacity: 0.7;
      letter-spacing: 1px;
    }
    .fold-indicator {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      font-size: 0.65rem;
      color: #d4cba0;
    }
    .fold-indicator span {
      background: #1f3a24;
      padding: 1px 12px;
      border-radius: 20px;
      border: 1px solid #7a8a5a;
    }
    @media (max-width: 400px) {
      .tile { width: 34px; height: 44px; font-size: 0.7rem; }
      .pc-hand .tile { width: 24px; height: 32px; }
    }
  </style>
</head>
<body>
<div id="game">
  <div class="header">
    <span>🎲 101 OKEY</span>
    <span class="turn-indicator" id="turnIndicator">Sıra: Siz</span>
  </div>

  <!-- Bilgisayarlar -->
  <div class="pc-area">
    <div class="pc-hand" id="pc1Hand"><div class="pc-label">💻 PC 1 <span class="badge" id="pc1Count">0</span></div></div>
    <div class="pc-hand" id="pc2Hand"><div class="pc-label">💻 PC 2 <span class="badge" id="pc2Count">0</span></div></div>
    <div class="pc-hand" id="pc3Hand"><div class="pc-label">💻 PC 3 <span class="badge" id="pc3Count">0</span></div></div>
  </div>

  <!-- Oyuncu - Okey Istakası -->
  <div class="player-area">
    <div class="player-hand" id="playerHand"></div>
    <div class="action-bar">
      <button class="btn" id="drawBtn">🔄 Taş Çek</button>
      <button class="btn btn-success" id="sortSeriBtn">📊 Seri Diz</button>
      <button class="btn btn-success" id="sortCiftBtn">♊ Çift Diz</button>
      <button class="btn btn-primary" id="foldBtn">📤 Katla</button>
      <button class="btn" id="passBtn">⏭️ Pas</button>
    </div>
    <div class="info-row">
      <span class="chip" id="playerCount">0 taş</span>
      <span class="fold-indicator"><span id="foldStatus">Katlamasız</span></span>
      <span class="chip" id="seriesInfo">Seri: -</span>
    </div>
  </div>

  <div id="messageBox" class="message-box">✨ Okey masası hazır. Taş çek veya katla.</div>
  <div class="footer">101 Okey · 3 PC · Okey Istakası</div>
</div>
<script>
  (function(){
    // --- OYUN DURUMU ---
    const state = {
      deck: [],
      players: [[], [], [], []],
      currentPlayer: 0,
      phase: 'draw',
      turnLock: false,
      gameOver: false,
      selectedTileIndex: -1,
      foldMode: false, // false: katlamasız, true: katlamalı
    };

    // DOM
    const playerHandEl = document.getElementById('playerHand');
    const pc1HandEl = document.getElementById('pc1Hand');
    const pc2HandEl = document.getElementById('pc2Hand');
    const pc3HandEl = document.getElementById('pc3Hand');
    const pcCounts = [
      document.getElementById('pc1Count'),
      document.getElementById('pc2Count'),
      document.getElementById('pc3Count')
    ];
    const playerCountEl = document.getElementById('playerCount');
    const turnIndicator = document.getElementById('turnIndicator');
    const messageBox = document.getElementById('messageBox');
    const foldStatusEl = document.getElementById('foldStatus');
    const seriesInfoEl = document.getElementById('seriesInfo');
    const drawBtn = document.getElementById('drawBtn');
    const sortSeriBtn = document.getElementById('sortSeriBtn');
    const sortCiftBtn = document.getElementById('sortCiftBtn');
    const foldBtn = document.getElementById('foldBtn');
    const passBtn = document.getElementById('passBtn');

    // --- yardımcılar ---
    function createDeck() {
      const colors = ['k', 'm', 's', 'y'];
      const deck = [];
      for (let c of colors) {
        for (let i = 1; i <= 13; i++) {
          deck.push({ color: c, value: i, id: `${c}${i}` });
        }
      }
      deck.push({ color: 'joker', value: 0, id: 'j1' });
      deck.push({ color: 'joker', value: 0, id: 'j2' });
      return shuffle(deck);
    }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function tileHTML(tile, faceDown = false) {
      if (faceDown) return `<div class="tile face-down"></div>`;
      let cls = 'tile';
      if (tile.color === 'joker') cls += ' joker';
      const label = tile.color === 'joker' ? '⭐' : `${tile.value}`;
      return `<div class="${cls}" data-id="${tile.id}">${label}</div>`;
    }

    // Seri / çift hesaplama (gösterge)
    function analyzeHand(hand) {
      if (hand.length === 0) return { seri: false, cift: false, info: 'Boş' };
      // basit kontrol: tüm aynı renk ve ardışık -> seri
      let allSameColor = true;
      let firstColor = hand[0].color;
      if (firstColor === 'joker') return { seri: false, cift: false, info: 'Joker' };
      for (let t of hand) {
        if (t.color !== firstColor || t.color === 'joker') { allSameColor = false; break; }
      }
      let values = hand.map(t => t.value).sort((a,b)=>a-b);
      let isConsecutive = true;
      for (let i = 1; i < values.length; i++) {
        if (values[i] !== values[i-1] + 1) { isConsecutive = false; break; }
      }
      if (allSameColor && isConsecutive && hand.length >= 3) {
        return { seri: true, cift: false, info: 'Seri ✓' };
      }
      // çift: tüm aynı değer
      let allSameValue = true;
      let firstVal = hand[0].value;
      for (let t of hand) {
        if (t.value !== firstVal || t.color === 'joker') { allSameValue = false; break; }
      }
      if (allSameValue && hand.length >= 3) {
        return { seri: false, cift: true, info: 'Çift ✓' };
      }
      return { seri: false, cift: false, info: 'Normal' };
    }

    // --- SIRALAMA (Seri / Çift) ---
    function sortBySeri(hand) {
      // renk bazında grupla, ardından değere göre sırala
      const grouped = {};
      for (let t of hand) {
        if (t.color === 'joker') { grouped['joker'] = grouped['joker'] || []; grouped['joker'].push(t); continue; }
        grouped[t.color] = grouped[t.color] || [];
        grouped[t.color].push(t);
      }
      let result = [];
      for (let color in grouped) {
        if (color === 'joker') { result = result.concat(grouped[color]); continue; }
        const sorted = grouped[color].sort((a,b) => a.value - b.value);
        result = result.concat(sorted);
      }
      return result;
    }

    function sortByCift(hand) {
      // değere göre grupla
      const grouped = {};
      for (let t of hand) {
        const key = t.value;
        grouped[key] = grouped[key] || [];
        grouped[key].push(t);
      }
      const keys = Object.keys(grouped).sort((a,b) => parseInt(a) - parseInt(b));
      let result = [];
      for (let k of keys) {
        result = result.concat(grouped[k]);
      }
      return result;
    }

    // --- RENDER ---
    function render() {
      const playerTiles = state.players[0];
      playerHandEl.innerHTML = playerTiles.map((t, idx) => {
        let html = tileHTML(t, false);
        if (state.selectedTileIndex === idx && state.phase === 'fold') {
          html = html.replace('tile', 'tile selected');
        }
        return html;
      }).join('');

      for (let i = 0; i < 3; i++) {
        const pcHand = state.players[i+1];
        const container = [pc1HandEl, pc2HandEl, pc3HandEl][i];
        const countLabel = pcCounts[i];
        const handHTML = pcHand.map(t => tileHTML(t, true)).join('');
        container.innerHTML = `<div class="pc-label">💻 PC ${i+1} <span class="badge">${pcHand.length}</span></div>` + 
          `<div style="display:flex; flex-wrap:wrap; gap:3px; justify-content:center;">${handHTML}</div>`;
        countLabel.textContent = pcHand.length;
      }

      playerCountEl.textContent = state.players[0].length + ' taş';
      const names = ['Siz', 'PC 1', 'PC 2', 'PC 3'];
      turnIndicator.textContent = `Sıra: ${names[state.currentPlayer]}`;
      foldStatusEl.textContent = state.foldMode ? 'Katlamalı' : 'Katlamasız';

      // analiz
      const analysis = analyzeHand(state.players[0]);
      seriesInfoEl.textContent = analysis.info;

      const isPlayerTurn = state.currentPlayer === 0 && !state.gameOver;
      drawBtn.disabled = !isPlayerTurn || state.phase !== 'draw' || state.turnLock;
      foldBtn.disabled = !isPlayerTurn || state.phase !== 'fold' || state.turnLock;
      passBtn.disabled = !isPlayerTurn || state.phase !== 'fold' || state.turnLock;
      sortSeriBtn.disabled = !isPlayerTurn || state.turnLock;
      sortCiftBtn.disabled = !isPlayerTurn || state.turnLock;

      if (state.gameOver) {
        messageBox.textContent = '🏆 Oyun bitti! Sayfayı yenileyin.';
      } else if (!isPlayerTurn && !state.gameOver) {
        messageBox.textContent = '🤖 Bilgisayar düşünüyor...';
      } else if (isPlayerTurn && state.phase === 'draw') {
        messageBox.textContent = '🎯 Taş çek veya Katla (katlamak için taş seç)';
      } else if (isPlayerTurn && state.phase === 'fold') {
        messageBox.textContent = '📤 Katlamak için taş seç, sonra "Katla" veya "Pas"';
      }
    }

    // --- OYUN BAŞLATMA ---
    function initGame() {
      state.deck = createDeck();
      state.players = [[], [], [], []];
      for (let i = 0; i < 4; i++) {
        state.players[i] = state.deck.splice(0, 14);
      }
      state.currentPlayer = 0;
      state.phase = 'draw';
      state.turnLock = false;
      state.gameOver = false;
      state.selectedTileIndex = -1;
      state.foldMode = false;
      render();
    }

    // --- OYUNCU HAREKETLERİ ---
    function playerDraw() {
      if (state.currentPlayer !== 0 || state.phase !== 'draw' || state.turnLock || state.gameOver) return;
      if (state.deck.length === 0) { messageBox.textContent = '⚠️ Deste bitti!'; return; }
      state.turnLock = true;
      const drawn = state.deck.pop();
      state.players[0].push(drawn);
      state.phase = 'fold';
      state.selectedTileIndex = -1;
      render();
      messageBox.textContent = '📥 Taş çektin. Katlamak için taş seç.';
      state.turnLock = false;
    }

    function playerFold() {
      if (state.currentPlayer !== 0 || state.phase !== 'fold' || state.turnLock || state.gameOver) return;
      const idx = state.selectedTileIndex;
      if (idx === -1 || idx >= state.players[0].length) {
        messageBox.textContent = '⚠️ Lütfen katlamak için bir taş seç.';
        return;
      }
      if (!state.foldMode) {
        messageBox.textContent = '⚠️ Katlamasız modda katlama yapılamaz. Pas geç.';
        state.selectedTileIndex = -1;
        render();
        return;
      }
      state.turnLock = true;
      state.players[0].splice(idx, 1);
      state.selectedTileIndex = -1;
      state.phase = 'draw';
      state.currentPlayer = (state.currentPlayer + 1) % 4;
      state.turnLock = false;
      render();
      messageBox.textContent = '📤 Taş katlandı. Sıra bilgisayarda.';
      setTimeout(() => computerTurn(), 500);
    }

    function playerPass() {
      if (state.currentPlayer !== 0 || state.phase !== 'fold' || state.turnLock || state.gameOver) return;
      state.turnLock = true;
      state.selectedTileIndex = -1;
      state.phase = 'draw';
      state.currentPlayer = (state.currentPlayer + 1) % 4;
      state.turnLock = false;
      render();
      messageBox.textContent = '⏭️ Pas geçtin. Sıra bilgisayarda.';
      setTimeout(() => computerTurn(), 500);
    }

    // --- SIRALAMA BUTONLARI ---
    function sortSeri() {
      if (state.currentPlayer !== 0 || state.turnLock || state.gameOver) return;
      state.players[0] = sortBySeri(state.players[0]);
      render();
      messageBox.textContent = '📊 Seri dizilimi uygulandı.';
    }
    function sortCift() {
      if (state.currentPlayer !== 0 || state.turnLock || state.gameOver) return;
      state.players[0] = sortByCift(state.players[0]);
      render();
      messageBox.textContent = '♊ Çift dizilimi uygulandı.';
    }

    // --- BİLGİSAYAR TURU ---
    function computerTurn() {
      if (state.gameOver) return;
      if (state.currentPlayer === 0) { render(); return; }
      state.turnLock = true;
      const playerIdx = state.currentPlayer;
      const hand = state.players[playerIdx];
      if (state.deck.length === 0) {
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        state.turnLock = false;
        render();
        setTimeout(() => computerTurn(), 300);
        return;
      }
      // bilgisayar: %60 taş çek, %40 katla
      const action = Math.random() > 0.4 ? 'draw' : 'fold';
      if (action === 'draw' || state.phase === 'draw') {
        const drawn = state.deck.pop();
        hand.push(drawn);
        state.phase = 'fold';
        if (hand.length > 14 && state.foldMode) {
          const discardIdx = Math.floor(Math.random() * hand.length);
          hand.splice(discardIdx, 1);
        } else if (!state.foldMode && hand.length > 14) {
          // katlamasız: atma
        }
        state.phase = 'draw';
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        state.turnLock = false;
        render();
        messageBox.textContent = `💻 PC ${playerIdx} taş çekti.`;
        setTimeout(() => computerTurn(), 500);
      } else {
        // katla / pas
        if (state.foldMode && hand.length > 0) {
          const idx = Math.floor(Math.random() * hand.length);
          hand.splice(idx, 1);
        }
        state.phase = 'draw';
        state.currentPlayer = (state.currentPlayer + 1) % 4;
        state.turnLock = false;
        render();
        setTimeout(() => computerTurn(), 400);
      }
    }

    // --- EVENTLER ---
    playerHandEl.addEventListener('click', (e) => {
      const tileDiv = e.target.closest('.tile');
      if (!tileDiv) return;
      if (state.currentPlayer !== 0 || state.phase !== 'fold' || state.turnLock || state.gameOver) return;
      const tiles = playerHandEl.querySelectorAll('.tile');
      let idx = -1;
      for (let i = 0; i < tiles.length; i++) {
        if (tiles[i] === tileDiv) { idx = i; break; }
      }
      if (idx === -1) return;
      state.selectedTileIndex = idx;
      render();
      messageBox.textContent = `✅ Taş seçildi (${idx+1}). "Katla" veya "Pas".`;
    });

    drawBtn.addEventListener('click', playerDraw);
    foldBtn.addEventListener('click', playerFold);
    passBtn.addEventListener('click', playerPass);
    sortSeriBtn.addEventListener('click', sortSeri);
    sortCiftBtn.addEventListener('click', sortCift);

    // başlat
    initGame();
    setTimeout(() => {
      if (state.currentPlayer !== 0) computerTurn();
    }, 400);
  })();
</script>
</body>
</html>
